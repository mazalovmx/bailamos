name: CI
on:
  workflow_dispatch:
  push:
    branches: [experiments, stable, deploy]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: dance
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dance
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U dance -d dance"
          --health-interval 5s --health-timeout 5s --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
      redis:
        image: redis:7.2-alpine
        ports: ['63799:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://dance:ci-only-password@127.0.0.1:54329/dance
      REDIS_URL: redis://127.0.0.1:63799
      NEXT_TELEMETRY_DISABLED: '1'
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-auth-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @dance/db test:integration
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify account and event workflow
        run: |
          pnpm --filter @dance/web start > /tmp/dance-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          pnpm --filter @dance/web test:e2e
